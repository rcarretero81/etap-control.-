height:36px;padding:7px 10px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(6,21,38,.98);border-top:1px solid #16415f;display:flex;justify-content:center;gap:7px;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{flex:1;max-width:170px;min-height:44px}.hidden{display:none}.badge{font-size:12px;color:#071a2d;background:var(--blue);border-radius:20px;padding:4px 8px;font-weight:800}.muted{color:var(--muted);font-size:13px;line-height:1.4}.notice{background:#143b55;border-left:4px solid var(--blue);padding:10px;border-radius:8px;font-size:13px;margin:8px 0;line-height:1.4}.check{display:flex;gap:9px;align-items:center}.check input{width:20px;height:20px;margin:0}.tablewrap{overflow:auto}.historyrow{font-size:13px;border-top:1px solid #28516a;padding:10px 0;line-height:1.45}.param-card{background:#0a2137;border:1px solid #194663;border-radius:14px;padding:12px;margin:10px 0}.param-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.param-name{font-weight:800;min-width:0;overflow-wrap:anywhere}.param-unit{font-size:11px;color:var(--muted);white-space:nowrap}.sample-value{font-size:17px;font-weight:700;text-align:right}.sample-row{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:10px;align-items:end;padding:11px 0;border-top:1px solid #194663}.sample-row:first-of-type{border-top:0}.ref{font-size:11px;color:var(--muted);margin-top:5px}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.form-actions .wide{margin-top:0}.subsection{margin-top:14px;padding-top:4px}.danger-outline{background:transparent;color:#ff8d95;border:1px solid #8b3942}

</style></head><body><header><h1>ETAP CONTROL</h1><div class="muted">Lectura diaria · funcionamiento offline</div></header><main class="wrap" id="app"></main><nav class="nav"><button onclick="home()">Lectura</button><button class="secondary" onclick="historyView()">Historial</button><button class="secondary" onclick="settings()">Ajustes</button></nav><script src="xlsx.min.js"></script><script>
const KEY='etap_control_v1';
const defaults={captaciones:['Captación Cerro Moro','Captación Garganta al Pajarero'],embalses:['Embalse El Pajarero','Embalse Lago Colinar','Embalse Presa Tierra Colinar'],puntos:['Decantador','Salida de ETAP','Depósito Distribución 1','Depósito Distribución 2','Médico','Ayuntamiento'],params:[{name:'Cloro libre',unit:'mg/L',min:'',max:'',enabled:true},{name:'pH',unit:'',min:'',max:'',enabled:true},{name:'Turbidez',unit:'NTU',min:'',max:'',enabled:true}],arrastres:['Ninguno','Fangos','Lodos','Hojas','Fangos y lodos','Hojas y restos vegetales','Otros'],ubicaciones:['PUNTOS DE MUESTREO','CAPTACIONES','PRESAS Y EMBALSES','RED DE DISTRIBUCION','ETAP','DEPOSITOS AGUA BRUTA','FILTROS','BOMBAS DOSIFICADORAS','MOTORES IMPULSION','ELECTROVALVULAS','CUADRO SINOPTICO']};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{...defaults,registros:[],incidencias:[]};if(!Array.isArray(db.ubicaciones))db.ubicaciones=[...defaults.ubicaciones];save();
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function home(targetPage=0){
  if(!history.state || history.state.etapRoute!=='form' && history.state.etapRoute!=='sample'){history.replaceState({etapRoute:'home',page:Number(targetPage)||0},'',location.href);}
const readings=db.registros.filter(r=>r.tipo==='Contador').sort((a,b)=>a.fecha.localeCompare(b.fecha));
const current=readings[readings.length-1];
const previous=readings.length>1?readings[readings.length-2]:null;
const consumo=current&&previous?(Number(current.valor)-Number(previous.valor)):null;
const prev=current;
app.innerHTML=`
<div class="page-indicator"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="pages" id="pages">
<section class="page"><div class="page-inner">
<div class="card hero"><div class="eyebrow">LECTURA DIARIA · 1</div><div class="title">LECTURA DEL CONTADOR</div><div class="muted">Introduce la lectura total del contador en m³.</div><label>Fecha y hora</label><input id="meterDt" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"><label>Lectura del contador (m³)</label><input id="meterValue" type="number" min="0" step="0.01" placeholder="0,00" value="${prev?esc(prev.valor):''}"><button class="wide ok" onclick="saveMeter()">💾 Guardar lectura</button></div>
</div></section>
<section class="page"><div class="page-inner">
<div class="card hero"><div class="eyebrow">LECTURA DIARIA · 2</div><div class="title">CONSUMO DIARIO</div><div class="muted">Cálculo automático: lectura actual − lectura del día anterior.</div><div class="grid"><div><label>Lectura anterior (m³)</label><input id="previousMeter" type="number" step="0.01" value="${previous?esc(previous.valor):''}" readonly></div><div><label>Lectura actual (m³)</label><input id="currentMeter" type="number" step="0.01" value="${current?esc(current.valor):''}" readonly></div></div><div class="result"><label>Consumo diario</label><strong>${consumo!==null&&consumo>=0?consumo.toFixed(2)+' m³':'Pendiente de dos lecturas'}</strong></div></div>
</div></section>
<section class="page"><div class="page-inner">
<div class="card"><div class="eyebrow">LECTURA DIARIA · 3</div><div class="title">PUNTOS DE MUESTREO</div>${listItems(db.puntos,'punto')}<button class="wide" onclick="addItem('puntos','punto de muestreo')">➕ Añadir punto de muestreo</button><button class="wide secondary" onclick="addPointFromCaptation()">➕ Añadir captación como punto</button></div>
</div></section>
<section class="page"><div class="page-inner">
<div class="card"><div class="eyebrow">LECTURA DIARIA · 4</div><div class="title">PRESAS Y EMBALSES</div>${listItems(db.embalses,'embalse')}<button class="wide" onclick="addItem('embalses','embalse')">➕ Añadir presa / embalse</button></div>
</div></section>
<section class="page"><div class="page-inner">
<div class="card"><div class="eyebrow">LECTURA DIARIA · 5</div><div class="title">CAPTACIONES</div>${listItems(db.captaciones,'captacion')}<button class="wide" onclick="addItem('captaciones','captación')">➕ Añadir captación</button></div>
</div></section>
<section class="page"><div class="page-inner">
<div class="card"><div class="eyebrow">LECTURA DIARIA · 6</div><div class="title">INCIDENCIAS</div><div class="muted">Registra la incidencia y adjunta el parte oficial, documentos y fotografías.</div><div class="notice">📎 Los archivos y fotos quedan asociados a esta incidencia para poder consultarlos posteriormente.</div><label>Fecha y hora de detección</label><input id="idt" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"><div class="grid"><div><label>Tipo de incidencia</label><select id="itipo"><option value="AB">AB · Analítica</option><option value="C">C · Indicadores</option><option value="E">E · Radiactividad</option><option value="II">II · Instalación interior</option><option value="O">O · Lista de observación</option><option value="F">F · Falta de suministro</option><option value="S">S · Situación excepcional</option><option value="X">X · Otro riesgo</option><option value="AVERIA">Avería</option><option value="OTRA">Otra</option></select></div><div><label>Estado</label><select id="iest"><option>Abierta</option><option>En seguimiento</option><option>Resuelta</option></select></div></div><label>Ubicación / punto afectado</label><div class="grid"><div><select id="il">${db.ubicaciones.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div><div><button class="wide secondary" type="button" onclick="addIncidentLocation()">➕ Añadir ubicación</button></div></div><label>Descripción de la incidencia</label><textarea id="idesc" placeholder="Describe qué ha ocurrido..."></textarea><label>Causa / origen</label><textarea id="icausa" placeholder="Causa conocida o investigación realizada..."></textarea><label>Medidas correctoras y preventivas</label><textarea id="imedidas" placeholder="Medidas adoptadas..."></textarea><label>Seguimiento / observaciones</label><textarea id="iseguimiento" placeholder="Seguimiento, resultados posteriores, comunicaciones..."></textarea>
<div class="card"><div class="title">📄 PARTE / DOCUMENTOS</div><div class="muted">Aquí podrás subir el parte oficial cuando lo tengas. Más adelante podremos utilizarlo para autorrellenarlo.</div><input id="incidentFiles" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png" multiple></div>
<div class="card"><div class="title">📷 FOTOGRAFÍAS DE LA INCIDENCIA</div><div class="muted">Puedes seleccionar varias fotos o hacerlas directamente con la cámara del móvil.</div><input id="incidentPhotos" type="file" accept="image/*" capture="environment" multiple><div id="photoPreview" class="muted" style="margin-top:8px"></div></div>
<div class="form-actions"><button class="wide ok" onclick="saveIncident()">💾 Guardar incidencia</button><button class="wide secondary" onclick="home(5)">Limpiar / volver</button></div></div><div class="card"><div class="title">INCIDENCIAS GUARDADAS</div>${db.incidencias.slice().reverse().map((x,i)=>`<div class="historyrow"><b>${new Date(x.fecha).toLocaleString('es-ES')}</b> · ${esc(x.tipo||'')} · ${esc(x.estado||'')}<br>${esc(x.ubicacion||'')}<br>${esc(x.descripcion||'')}<br><span class="muted">${esc(x.medidas||'')}</span>${(x.archivos?.length||x.fotos?.length)?`<br><button class="small secondary" onclick="showIncidentAttachments(${db.incidencias.length-1-i})">📎 Ver adjuntos (${(x.archivos?.length||0)+(x.fotos?.length||0)})</button>`:''}</div>`).join('')||'<span class="muted">Ninguna incidencia guardada.</span>'}</div>
</div></section>
</div>
<div class="swipe-hint">Desliza ← → para cambiar de página</div>`;
const pages=document.getElementById('pages');
if(pages){
  const go=()=>{const idx=Math.max(0,Math.min(5,Number(targetPage)||0));pages.scrollLeft=idx*pages.clientWidth;document.querySelectorAll('.page-indicator .dot').forEach((d,i)=>d.classList.toggle('active',i===idx));};
  pages.addEventListener('scroll',()=>{const idx=Math.round(pages.scrollLeft/pages.clientWidth);document.querySelectorAll('.page-indicator .dot').forEach((d,i)=>d.classList.toggle('active',i===idx));});
  requestAnimationFrame(go);
}
}
function saveMeter(){const v=parseFloat(String(meterValue.value).replace(',','.'));if(!Number.isFinite(v)||v<0){alert('Introduce una lectura válida en m³.');return}const d=new Date(meterDt.value||Date.now());const readings=db.registros.filter(r=>r.tipo==='Contador').sort((a,b)=>a.fecha.localeCompare(b.fecha));const previous=readings.length?Number(readings[readings.length-1].valor):null;if(previous!==null&&v<previous){alert('La lectura actual no puede ser inferior a la anterior.');return}db.registros.push({fecha:d.toISOString(),tipo:'Contador',punto:'Contador general',parametro:'Lectura contador',valor:v.toFixed(2),unidad:'m³',observaciones:'',consumoDiario:previous!==null?(v-previous).toFixed(2):null});save();alert(previous!==null?'Lectura guardada. Consumo diario: '+(v-previous).toFixed(2)+' m³':'Primera lectura guardada. Mañana se calculará el consumo.');home();}
function calculateConsumption(){home();}
function listItems(arr,type){return arr.map((x,i)=>`<div class="item"><span>${esc(x)}</span><span><button class="small" onclick="openForm('${type}',${i})">Abrir</button><button class="small secondary" onclick="renameItem('${type}',${i})">Editar</button></span></div>`).join('')}
function addItem(key,label){let n=prompt('Nombre de '+label+':');if(n&&n.trim()){db[key].push(n.trim());save();home()}}
function renameItem(type,i){let key=type==='captacion'?'captaciones':type==='embalse'?'embalses':'puntos';let n=prompt('Nuevo nombre:',db[key][i]);if(n&&n.trim()){db[key][i]=n.trim();save();home()}}
function addPointFromCaptation(){let n=prompt('¿Qué captación quieres añadir como punto de muestreo?');if(n&&n.trim()){if(!db.puntos.includes(n.trim()))db.puntos.push(n.trim());save();home()}}
function openForm(type,i){const parentPage=type==='embalse'?3:4;history.replaceState({etapRoute:'home',page:parentPage},'',location.href);history.pushState({etapRoute:'form',type:type,index:i,parentPage:parentPage},'',location.href);let key=type==='captacion'?'captaciones':'embalses',name=db[key][i];app.innerHTML=`<div class="card"><div class="title">${esc(name)}</div><div class="muted">Registro de inspección</div><label>Fecha y hora</label><input id="dt" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"><label>Estado del agua</label><select id="estado"><option>Bueno</option><option>Regular</option><option>Malo</option></select><label>Volumen</label><select id="vol"><option>Alto</option><option>Medio</option><option>Bajo</option></select><label>Arrastres / materiales</label><select id="arr">${db.arrastres.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="other"></div><label>Observaciones</label><textarea id="obs"></textarea><button class="wide ok" onclick="saveInspection('${type}',${i})">💾 Guardar lectura</button><button class="wide secondary" onclick="history.back()">Atrás</button></div>`;arr.onchange=()=>other.innerHTML=arr.value==='Otros'?'<label>Especificar otros</label><input id="otro">':''}
function saveInspection(type,i){let key=type==='captacion'?'captaciones':'embalses',name=db[key][i],d=new Date(dt.value||Date.now());db.registros.push({fecha:d.toISOString(),tipo:type==='captacion'?'Captación':'Embalse',punto:name,parametro:'Estado agua',valor:estado.value,unidad:'',observaciones:obs.value});db.registros.push({fecha:d.toISOString(),tipo:type==='captacion'?'Captación':'Embalse',punto:name,parametro:'Volumen',valor:vol.value,unidad:'',observaciones:obs.value});db.registros.push({fecha:d.toISOString(),tipo:type==='captacion'?'Captación':'Embalse',punto:name,parametro:'Arrastres/materiales',valor:arr.value==='Otros'?('Otros: '+(document.getElementById('otro')?.value||'')):arr.value,unidad:'',observaciones:obs.value});save();alert('Lectura guardada');const pg=type==='embalse'?3:4;history.replaceState({etapRoute:'home',page:pg},'',location.href);home(pg)}
function sampleForm(i){history.replaceState({etapRoute:'home',page:2},'',location.href);history.pushState({etapRoute:'sample',index:i,parentPage:2},'',location.href);let name=db.puntos[i];let ps=db.params.filter(p=>p.enabled);app.innerHTML=`<div class="card"><div class="section-head"><div><div class="title">PUNTO DE MUESTREO</div><div class="muted">${esc(name)}</div></div><span class="badge">${ps.length} parámetros</span></div><label>Fecha y hora</label><input id="dt" type="datetime-local" value="${new Date().toISOString().slice(0,16)}"><div class="subsection"><div class="title">PARÁMETROS</div>${ps.map((p,j)=>`<div class="sample-row"><div><div class="param-name">${esc(p.name)}</div>${p.min||p.max?`<div class="ref">Referencia: ${esc(p.min||'')} ${p.max?'– '+esc(p.max):''}</div>`:''}</div><div><label style="margin-top:0">Valor${p.unit?' · '+esc(p.unit):''}</label><input class="sample-value" id="p${j}" inputmode="decimal" placeholder="—"></div></div>`).join('')}</div><label>Observaciones</label><textarea id="obs" placeholder="Observaciones del muestreo..."></textarea><div class="form-actions"><button class="ok wide" onclick="saveSample(${i})">💾 Guardar</button><button class="secondary wide" onclick="history.back()">Atrás</button></div></div>`}
function saveSample(i){let d=new Date(dt.value||Date.now()),name=db.puntos[i],ps=db.params.filter(p=>p.enabled);ps.forEach((p,j)=>{let v=document.getElementById('p'+j).value;if(v!=='')db.registros.push({fecha:d.toISOString(),tipo:'Muestreo',punto:name,parametro:p.name,valor:v,unidad:p.unit||'',observaciones:obs.value})});save();alert('Muestreo guardado');history.replaceState({etapRoute:'home',page:2},'',location.href);home(2)}
function historyView(){let rows=[...db.registros].sort((a,b)=>b.fecha.localeCompare(a.fecha));app.innerHTML=`<div class="card"><div class="section-head"><div class="title">HISTORIAL</div><span class="badge">${rows.length}</span></div><button class="wide ok" onclick="exportXlsx()">📊 Exportar a Excel (.xlsx)</button><button class="wide secondary" onclick="goToPage(5)">⚠️ Incidencias</button>${rows.length?rows.map(r=>`<div class="historyrow"><b>${new Date(r.fecha).toLocaleString('es-ES')}</b> · ${esc(r.tipo)} · ${esc(r.punto)}<br>${esc(r.parametro)}: <b>${esc(r.valor)}</b> ${esc(r.unidad)}<br><span class="muted">${esc(r.observaciones||'')}</span></div>`).join(''):'<p class="muted">Todavía no hay lecturas.</p>'}</div>`}
function goToPage(page){home(page);setTimeout(()=>{const el=document.getElementById('pages');if(el){el.scrollTo({left:el.clientWidth*page,behavior:'smooth'});}},0)}
function incident(){goToPage(5)}
function addIncidentLocation(){let n=prompt('Nombre de la nueva ubicación:');if(n&&n.trim()){n=n.trim();if(!db.ubicaciones.includes(n))db.ubicaciones.push(n);save();incident();setTimeout(()=>{const el=document.getElementById('il');if(el)el.value=n},0)}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,size:file.size,data:r.result});r.onerror=reject;r.readAsDataURL(file)})}
function photoToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600;let w=img.width,h=img.height;if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve({name:file.name,type:'image/jpeg',size:0,data:c.toDataURL('image/jpeg',.78)})};img.onerror=()=>resolve({name:file.name,type:file.type,size:file.size,data:r.result});img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function showIncidentAttachments(index){const x=db.incidencias[index];let html='<div class="card"><div class="title">ADJUNTOS DE LA INCIDENCIA</div>';if(x.archivos?.length){html+='<b>Documentos</b>';x.archivos.forEach((f,i)=>{html+=`<button class="wide secondary" onclick="downloadAttachment(${index},'archivo',${i})">📄 ${esc(f.name)}</button>`})}if(x.fotos?.length){html+='<b style="display:block;margin-top:12px">Fotografías</b>';x.fotos.forEach((f,i)=>{html+=`<div style="margin:8px 0"><img src="${f.data}" style="width:100%;border-radius:10px"><button class="wide secondary" onclick="downloadAttachment(${index},'foto',${i})">⬇️ Descargar foto</button></div>`})}html+='<button class="wide" onclick="incident()">Atrás</button></div>';app.innerHTML=html}
function downloadAttachment(index,kind,i){const x=db.incidencias[index],f=kind==='archivo'?x.archivos[i]:x.fotos[i];const a=document.createElement('a');a.href=f.data;a.download=f.name||('incidencia_'+Date.now());document.body.appendChild(a);a.click();a.remove()}
async function saveIncident(){try{const d=new Date(idt.value||Date.now());const files=[...(document.getElementById('incidentFiles')?.files||[])];const photos=[...(document.getElementById('incidentPhotos')?.files||[])];const archivos=await Promise.all(files.map(fileToDataURL));const fotos=await Promise.all(photos.map(photoToDataURL));db.incidencias.push({fecha:d.toISOString(),tipo:itipo.value,ubicacion:il.value,descripcion:idesc.value,causa:icausa.value,medidas:imedidas.value,seguimiento:iseguimiento.value,estado:iest.value,archivos,fotos});save();alert('Incidencia guardada con '+(archivos.length+fotos.length)+' adjunto(s).');goToPage(5)}catch(e){alert('No se han podido guardar los archivos adjuntos.')}}
// intercept point opening to show sampling form
window.addEventListener('popstate',function(e){
  if(e.state && e.state.etapRoute==='home'){
    home(Number(e.state.page)||0);
  }else if(e.state && e.state.etapRoute==='form'){
    home(Number(e.state.parentPage) || (e.state.type==='embalse'?3:4));
  }else if(e.state && e.state.etapRoute==='sample'){
    home(Number(e.state.parentPage)||2);
  }else{
    home(0);
  }
});
if(!history.state || !history.state.etapRoute){history.replaceState({etapRoute:'home',page:0},'',location.href);}
