<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6b53">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">
<title>ETAP Control</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f2f5f4;
 color:#17211e
}
header{
 background:#0b6b53;
 color:white;
 padding:16px;
 text-align:center;
 position:sticky;
 top:0;
 z-index:10
}
h1{margin:0;font-size:22px}
h2{margin-top:0}
main{
 max-width:750px;
 margin:auto;
 padding:15px 15px 85px
}
.page{display:none}
.page.active{display:block}
.card{
 background:white;
 border-radius:14px;
 padding:16px;
 margin-bottom:15px;
 box-shadow:0 2px 8px #0002
}
label{
 display:block;
 font-weight:bold;
 margin:10px 0 5px
}
input,select,textarea{
 width:100%;
 padding:11px;
 border:1px solid #ccd5d2;
 border-radius:9px;
 font-size:16px;
 background:white
}
textarea{min-height:90px}
button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 font-weight:bold;
 font-size:14px
}
.primary{background:#0b6b53;color:white}
.secondary{background:#e5ece9;color:#17352d}
.danger{background:#c62828;color:white}
.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px
}
.item{
 border:1px solid #d8e1de;
 border-radius:10px;
 padding:12px;
 margin:8px 0
}
.muted{color:#66736f;font-size:13px}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:white;
 border-top:1px solid #ddd;
 display:flex;
 overflow-x:auto;
 z-index:20
}
nav button{
 flex:0 0 auto;
 background:white;
 color:#345;
 padding:10px 12px;
 font-size:12px
}
nav button.active{color:#0b6b53}
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:30;
 padding:20px;
 overflow:auto
}
.modal.show{display:block}
.modalbox{
 background:white;
 max-width:600px;
 margin:30px auto;
 border-radius:14px;
 padding:18px
}
table{
 width:100%;
 border-collapse:collapse;
 font-size:14px
}
td,th{
 padding:8px;
 border-bottom:1px solid #ddd;
 text-align:left
}
.photo{
 max-width:100%;
 max-height:200px;
 border-radius:8px
}
</style>
</head>

<body>

<header>
<h1>ETAP Control</h1>
</header>

<main>

<!-- INICIO -->
<section id="inicio" class="page active">

<div class="card">
<h2>Lectura del contador</h2>

<label>Fecha</label>
<input id="fechaContador" type="date">

<label>Lectura del contador (m³)</label>
<input id="lecturaContador" type="number" step="0.01">

<div class="actions">
<button class="primary" onclick="guardarContador()">Guardar</button>
</div>

<p id="consumoActual" class="muted"></p>
</div>

<div class="card">
<h2>Resumen</h2>
<div id="resumen"></div>
</div>

</section>


<!-- MUESTREO -->
<section id="muestreo" class="page">

<div class="card">

<h2>Muestreo</h2>

<label>Fecha</label>
<input id="fechaMuestreo" type="date">

<label>Punto de muestreo</label>
<select id="puntoMuestreo"></select>

<div id="parametros"></div>

<label>Observaciones</label>
<textarea id="observaciones"></textarea>

<div class="actions">
<button class="primary" onclick="guardarMuestreo()">Guardar</button>
<button class="secondary" onclick="cancelarMuestreo()">Cancelar</button>
</div>

</div>

</section>


<!-- CAPTACIONES -->
<section id="captaciones" class="page">

<div class="card">
<h2>Captaciones</h2>

<div id="captacionesLista"></div>

<button class="primary" onclick="nuevaCaptacion()">
Añadir captación
</button>

</div>

</section>


<!-- PRESAS -->
<section id="presas" class="page">

<div class="card">
<h2>Presas y embalses</h2>

<div id="presasLista"></div>

<button class="primary" onclick="nuevaPresa()">
Añadir presa / embalse
</button>

</div>

</section>


<!-- INCIDENCIAS -->
<section id="incidencias" class="page">

<div class="card">

<h2>Incidencias</h2>

<label>Fecha</label>
<input id="incFecha" type="date">

<label>Título</label>
<input id="incTitulo">

<label>Descripción</label>
<textarea id="incDescripcion"></textarea>

<label>Fotografía</label>
<input id="incFoto" type="file" accept="image/*" capture="environment">

<button class="primary" onclick="guardarIncidencia()">
Guardar incidencia
</button>

</div>

<div class="card">
<div id="incidenciasLista"></div>
</div>

</section>


<!-- HISTORIAL -->
<section id="historial" class="page">

<div class="card">

<h2>Historial</h2>

<h3>Lecturas del contador</h3>
<div id="historialContadores"></div>

<h3>Muestreos</h3>
<div id="historialMuestreos"></div>

<h3>Incidencias</h3>
<div id="historialIncidencias"></div>

<div class="actions">
<button class="secondary" onclick="exportarCSV()">
Exportar datos
</button>
</div>

</div>

</section>


<!-- AJUSTES -->
<section id="ajustes" class="page">

<div class="card">

<h2>Ajustes</h2>

<h3>Parámetros</h3>
<div id="ajustesParametros"></div>

<button class="primary" onclick="nuevoParametro()">
Añadir parámetro
</button>

<h3>Puntos de muestreo</h3>
<div id="ajustesPuntos"></div>

<button class="primary" onclick="nuevoPunto()">
Añadir punto
</button>

<h3>Captaciones</h3>
<div id="ajustesCaptaciones"></div>

<h3>Presas y embalses</h3>
<div id="ajustesPresas"></div>

</div>

</section>

</main>


<nav id="menu"></nav>


<!-- MODAL -->
<div id="modal" class="modal">

<div class="modalbox">

<div id="modalContenido"></div>

<div class="actions">
<button class="secondary" onclick="cerrarModal()">
Cerrar
</button>
</div>

</div>

</div>


<script>

const KEY="ETAP_CONTROL_DATOS";

const CONFIG_DEFAULT={
 parametros:[
  {id:"cloro",nombre:"Cloro libre",unidad:"mg/L"},
  {id:"ph",nombre:"pH",unidad:""},
  {id:"turbidez",nombre:"Turbidez",unidad:"NTU"}
 ],
 puntos:[
  {id:"entrada",nombre:"Entrada ETAP"},
  {id:"deposito2",nombre:"Depósito Distribución 2"}
 ],
 captaciones:[],
 presas:[]
};

let datos={
 config:JSON.parse(JSON.stringify(CONFIG_DEFAULT)),
 contadores:[],
 muestreos:[],
 incidencias:[]
};

let editandoMuestreo=null;
let editandoIncidencia=null;


function cargar(){

 try{

  const guardado=localStorage.getItem(KEY);

  if(guardado){

   const d=JSON.parse(guardado);

   datos=d;

   datos.config=datos.config||JSON.parse(JSON.stringify(CONFIG_DEFAULT));

  }

 }catch(e){}

}


function guardar(){

 localStorage.setItem(KEY,JSON.stringify(datos));

}


function id(){

 return Date.now().toString(36)+Math.random().toString(36).substring(2);

}


function hoy(){

 return new Date().toISOString().substring(0,10);

}


function escapar(x){

 return String(x??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");

}


/* NAVEGACIÓN */

function construirMenu(){

 const paginas=[
  ["inicio","Inicio"],
  ["muestreo","Muestreo"],
  ["captaciones","Captaciones"],
  ["presas","Presas"],
  ["incidencias","Incidencias"],
  ["historial","Historial"],
  ["ajustes","Ajustes"]
 ];

 menu.innerHTML=paginas.map(p=>
 `<button data-page="${p[0]}" onclick="pagina('${p[0]}')">${p[1]}</button>`
 ).join("");

}


function pagina(nombre){

 document.querySelectorAll(".page")
 .forEach(x=>x.classList.remove("active"));

 document.getElementById(nombre)
 .classList.add("active");

 document.querySelectorAll("#menu button")
 .forEach(x=>x.classList.toggle(
  "active",
  x.dataset.page===nombre
 ));

 actualizarTodo();

}


/* CONTADOR */

function guardarContador(){

 const fecha=fechaContador.value;
 const lectura=parseFloat(lecturaContador.value);

 if(!fecha || isNaN(lectura)){

  alert("Introduce la fecha y la lectura.");

  return;

 }

 const existente=datos.contadores.find(x=>x.fecha===fecha);

 if(existente){

  existente.lectura=lectura;

 }else{

  datos.contadores.push({
   id:id(),
   fecha:fecha,
   lectura:lectura
  });

 }

 datos.contadores.sort((a,b)=>a.fecha.localeCompare(b.fecha));

 guardar();

 lecturaContador.value="";

 actualizarTodo();

 alert("Lectura guardada.");

}


function calcularConsumo(){

 const lista=[...datos.contadores]
 .sort((a,b)=>a.fecha.localeCompare(b.fecha));

 if(lista.length<2)return null;

 return lista[lista.length-1].lectura-
        lista[lista.length-2].lectura;

}


function renderInicio(){

 fechaContador.value=fechaContador.value||hoy();

 const consumo=calcularConsumo();

 consumoActual.textContent=
 consumo===null
 ?"Consumo diario: —"
 :"Consumo diario: "+consumo.toFixed(2)+" m³";

 const lista=[...datos.contadores]
 .sort((a,b)=>b.fecha.localeCompare(a.fecha));

 if(!lista.length){

  resumen.innerHTML="<p class='muted'>No hay lecturas.</p>";

  return;

 }

 const x=lista[0];

 resumen.innerHTML=
 `<p><b>Última lectura:</b> ${escapar(x.lectura)} m³</p>
  <p><b>Fecha:</b> ${escapar(x.fecha)}</p>`;

}


/* MUESTREO */

function renderMuestreo(){

 fechaMuestreo.value=fechaMuestreo.value||hoy();

 puntoMuestreo.innerHTML=
 datos.config.puntos.map(p=>
 `<option value="${escapar(p.id)}">${escapar(p.nombre)}</option>`
 ).join("");

 parametros.innerHTML=
 datos.config.parametros.map(p=>

 `<label>
 ${escapar(p.nombre)}
 ${p.unidad?"("+escapar(p.unidad)+")":""}
 </label>
 <input class="valorParametro"
 data-id="${escapar(p.id)}">`

 ).join("");

 if(editandoMuestreo){

  const m=datos.muestreos.find(x=>x.id===editandoMuestreo);

  if(m){

   fechaMuestreo.value=m.fecha;
   puntoMuestreo.value=m.punto;

   observaciones.value=m.observaciones||"";

   document.querySelectorAll(".valorParametro")
   .forEach(i=>{

    i.value=m.valores?.[i.dataset.id]||"";

   });

  }

 }

}


function guardarMuestreo(){

 if(!fechaMuestreo.value){

  alert("Introduce la fecha.");

  return;

 }

 const valores={};

 document.querySelectorAll(".valorParametro")
 .forEach(i=>{
  valores[i.dataset.id]=i.value;
 });

 if(editandoMuestreo){

  const m=datos.muestreos.find(
   x=>x.id===editandoMuestreo
  );

  if(m){

   m.fecha=fechaMuestreo.value;
   m.punto=puntoMuestreo.value;
   m.valores=valores;
   m.observaciones=observaciones.value;

  }

 }else{

  datos.muestreos.push({

   id:id(),
   fecha:fechaMuestreo.value,
   punto:puntoMuestreo.value,
   valores:valores,
   observaciones:observaciones.value

  });

 }

 editandoMuestreo=null;

 guardar();

 actualizarTodo();

 alert("Muestreo guardado.");

}


function cancelarMuestreo(){

 editandoMuestreo=null;

 observaciones.value="";

 renderMuestreo();

}


/* CAPTACIONES */

function renderCaptaciones(){

 if(!datos.config.captaciones.length){

  captacionesLista.innerHTML=
  "<p class='muted'>No hay captaciones.</p>";

  return;

 }

 captacionesLista.innerHTML=
 datos.config.captaciones.map(x=>

 `<div class="item">
 <b>${escapar(x.nombre)}</b>
 <div class="actions">

 <button class="secondary"
 onclick="editarCaptacion('${x.id}')">
 Modificar
 </button>

 <button class="danger"
 onclick="borrarCaptacion('${x.id}')">
 Borrar
 </button>

 </div>
 </div>`

 ).join("");

}


function nuevaCaptacion(){

 abrirNombre("captacion","");

}


function editarCaptacion(id){

 abrirNombre("captacion",id);

}


function abrirNombre(tipo,idEditar){

 let lista=tipo==="captacion"
 ?datos.config.captaciones
 :datos.config.presas;

 let x=idEditar
 ?lista.find(a=>a.id===idEditar)
 :null;

 modalContenido.innerHTML=

 `<h2>${idEditar?"Modificar":"Añadir"}
 ${tipo==="captacion"?"captación":"presa / embalse"}</h2>

 <label>Nombre</label>
 <input id="nombreModal"
 value="${escapar(x?.nombre||"")}">

 <div class="actions">

 <button class="primary"
 onclick="guardarNombre('${tipo}','${idEditar}')">
 Guardar
 </button>

 </div>`;

 modal.classList.add("show");

}


function guardarNombre(tipo,idEditar){

 const nombre=nombreModal.value.trim();

 if(!nombre){

  alert("Introduce un nombre.");

  return;

 }

 let lista=tipo==="captacion"
 ?datos.config.captaciones
 :datos.config.presas;

 if(idEditar){

  const x=lista.find(a=>a.id===idEditar);

  if(x)x.nombre=nombre;

 }else{

  lista.push({
   id:id(),
   nombre:nombre
  });

 }

 guardar();

 cerrarModal();

 actualizarTodo();

}


function borrarCaptacion(id){

 if(!confirm("¿Borrar esta captación?"))return;

 datos.config.captaciones=
 datos.config.captaciones.filter(x=>x.id!==id);

 guardar();

 actualizarTodo();

}


/* PRESAS */

function renderPresas(){

 if(!datos.config.presas.length){

  presasLista.innerHTML=
  "<p class='muted'>No hay presas o embalses.</p>";

  return;

 }

 presasLista.innerHTML=
 datos.config.presas.map(x=>

 `<div class="item">
 <b>${escapar(x.nombre)}</b>

 <div class="actions">

 <button class="secondary"
 onclick="editarPresa('${x.id}')">
 Modificar
 </button>

 <button class="danger"
 onclick="borrarPresa('${x.id}')">
 Borrar
 </button>

 </div>

 </div>`

 ).join("");

}


function nuevaPresa(){

 abrirNombre("presa","");

}


function editarPresa(id){

 abrirNombre("presa",id);

}


function borrarPresa(id){

 if(!confirm("¿Borrar esta presa o embalse?"))return;

 datos.config.presas=
 datos.config.presas.filter(x=>x.id!==id);

 guardar();

 actualizarTodo();

}


/* INCIDENCIAS */

function guardarIncidencia(){

 const titulo=incTitulo.value.trim();

 if(!titulo){

  alert("Introduce un título.");

  return;

 }

 const archivo=incFoto.files[0];

 const registro={

  id:editandoIncidencia||id(),
  fecha:incFecha.value||hoy(),
  titulo:titulo,
  descripcion:incDescripcion.value,
  foto:""

 };

 if(editandoIncidencia){

  const anterior=
  datos.incidencias.find(x=>x.id===editandoIncidencia);

  if(anterior)registro.foto=anterior.foto||"";

 }

 function terminar(){

  if(editandoIncidencia){

   const pos=datos.incidencias.findIndex(
    x=>x.id===editandoIncidencia
   );

   if(pos>=0)
   datos.incidencias[pos]=registro;

  }else{

   datos.incidencias.push(registro);

  }

  editandoIncidencia=null;

  guardar();

  actualizarTodo();

  alert("Incidencia guardada.");

 }

 if(archivo){

  const lector=new FileReader();

  lector.onload=()=>{

   registro.foto=lector.result;

   terminar();

  };

  lector.readAsDataURL(archivo);

 }else{

  terminar();

 }

}


function renderIncidencias(){

 if(!datos.incidencias.length){

  incidenciasLista.innerHTML=
  "<p class='muted'>No hay incidencias.</p>";

  return;

 }

 incidenciasLista.innerHTML=
 datos.incidencias.slice().reverse().map(x=>

 `<div class="item">

 <b>${escapar(x.fecha)}</b>
 <h3>${escapar(x.titulo)}</h3>
 <p>${escapar(x.descripcion)}</p>

 ${x.foto?
 `<img class="photo" src="${x.foto}">`
 :""
 }

 <div class="actions">

 <button class="secondary"
 onclick="editarIncidencia('${x.id}')">
 Modificar
 </button>

 <button class="danger"
 onclick="borrarIncidencia('${x.id}')">
 Borrar
 </button>

 </div>

 </div>`

 ).join("");

}


function editarIncidencia(id){

 const x=datos.incidencias.find(a=>a.id===id);

 if(!x)return;

 editandoIncidencia=id;

 incFecha.value=x.fecha;
 incTitulo.value=x.titulo;
 incDescripcion.value=x.descripcion;

 pagina("incidencias");

}


function borrarIncidencia(id){

 if(!confirm("¿Borrar esta incidencia?"))return;

 datos.incidencias=
 datos.incidencias.filter(x=>x.id!==id);

 guardar();

 actualizarTodo();

}


/* HISTORIAL */

function renderHistorial(){

 historialContadores.innerHTML=
 datos.contadores.length?

 `<table>
 <tr>
 <th>Fecha</th>
 <th>m³</th>
 <th>Acciones</th>
 </tr>

 ${datos.contadores
 .slice()
 .sort((a,b)=>b.fecha.localeCompare(a.fecha))
 .map(x=>

 `<tr>

 <td>${escapar(x.fecha)}</td>

 <td>${escapar(x.lectura)}</td>

 <td>

 <button class="secondary"
 onclick="editarContador('${x.id}')">
 Modificar
 </button>

 <button class="danger"
 onclick="borrarContador('${x.id}')">
 Borrar
 </button>

 </td>

 </tr>`

 ).join("")}

 </table>`

 :"Sin lecturas.";


 historialMuestreos.innerHTML=
 datos.muestreos.length?

 datos.muestreos.slice().reverse().map(x=>{

  const punto=
  datos.config.puntos.find(p=>p.id===x.punto)?.nombre
  ||"Punto eliminado";

  const valores=
  Object.entries(x.valores||{}).map(([id,v])=>{

   const p=
   datos.config.parametros.find(a=>a.id===id);

   return p?
   `${escapar(p.nombre)}: ${escapar(v)} ${escapar(p.unidad)}`
   :"";

  }).filter(Boolean).join(" · ");

  return`

  <div class="item">

  <b>${escapar(x.fecha)} — ${escapar(punto)}</b>

  <p>${valores}</p>

  <p>${escapar(x.observaciones||"")}</p>

  <div class="actions">

  <button class="secondary"
  onclick="editarMuestreo('${x.id}')">
  Modificar
  </button>

  <button class="danger"
  onclick="borrarMuestreo('${x.id}')">
  Borrar
  </button>

  </div>

  </div>`;

 }).join("")

 :"Sin muestreos.";


 historialIncidencias.innerHTML=
 datos.incidencias.length?

 datos.incidencias.slice().reverse().map(x=>

 `<div class="item">

 <b>${escapar(x.fecha)} — ${escapar(x.titulo)}</b>

 <p>${escapar(x.descripcion)}</p>

 </div>`

 ).join("")

 :"Sin incidencias.";

}


function editarContador(id){

 const x=datos.contadores.find(a=>a.id===id);

 if(!x)return;

 modalContenido.innerHTML=

 `<h2>Modificar lectura</h2>

 <label>Fecha</label>
 <input id="editFecha" type="date"
 value="${escapar(x.fecha)}">

 <label>Lectura (m³)</label>
 <input id="editLectura" type="number"
 step="0.01"
 value="${escapar(x.lectura)}">

 <div class="actions">

 <button class="primary"
 onclick="guardarContadorEditado('${id}')">
 Guardar
 </button>

 </div>`;

 modal.classList.add("show");

}


function guardarContadorEditado(id){

 const x=datos.contadores.find(a=>a.id===id);

 if(!x)return;

 x.fecha=editFecha.value;
 x.lectura=parseFloat(editLectura.value);

 guardar();

 cerrarModal();

 actualizarTodo();

}


function borrarContador(id){

 if(!confirm("¿Borrar esta lectura?"))return;

 datos.contadores=
 datos.contadores.filter(x=>x.id!==id);

 guardar();

 actualizarTodo();

}


function editarMuestreo(id){

 editandoMuestreo=id;

 pagina("muestreo");

}


function borrarMuestreo(id){

 if(!confirm("¿Borrar este muestreo?"))return;

 datos.muestreos=
 datos.muestreos.filter(x=>x.id!==id);

 guardar();

 actualizarTodo();

}


/* AJUSTES */

function renderAjustes(){

 ajustesParametros.innerHTML=
 datos.config.parametros.map(x=>

 `<div class="item">

 <b>${escapar(x.nombre)}</b>
 ${x.unidad?
 ` (${escapar(x.unidad)})`
 :""
 }

 <div class="actions">

 <button class="secondary"
 onclick="editarParametro('${x.id}')">
 Modificar
 </button>

 <button class="danger"
 onclick="borrarParametro('${x.id}')">
 Borrar
 </button>

 </div>

 </div>`

 ).join("");


 ajustesPuntos.innerHTML=
 datos.config.puntos.map(x=>

 `<div class="item">

 <b>${escapar(x.nombre)}</b>

 <div class="actions">

 <button class="secondary"
 onclick="editarPunto('${x.id}')">
 Modificar
 </button>

 <button class="danger"
 onclick="borrarPunto('${x.id}')">
 Borrar
 </button>

 </div>

 </div>`

 ).join("");


 ajustesCaptaciones.innerHTML=
 datos.config.captaciones.length?

 datos.config.captaciones.map(x=>

 `<div class="item">
 ${escapar(x.nombre)}
 <button class="secondary"
 onclick="editarCaptacion('${x.id}')">
 Modificar
 </button>
 </div>`

 ).join("")

 :"No hay captaciones.";


 ajustesPresas.innerHTML=
 datos.config.presas.length?

 datos.config.presas.map(x=>

 `<div class="item">
 ${escapar(x.nombre)}
 <button class="secondary"
 onclick="editarPresa('${x.id}')">
 Modificar
 </button>
 </div>`

 ).join("")

 :"No hay presas.";

}

/* EXPORTAR */

function exportarCSV(){

 let filas=[
 ["TIPO","FECHA","LUGAR","PARAMETRO","VALOR","UNIDAD","OBSERVACIONES"]
 ];

 datos.contadores.forEach(x=>{

  filas.push([
   "Contador",
   x.fecha,
   "",
   "Lectura",
   x.lectura,
   "m³",
   ""
  ]);

 });


 datos.muestreos.forEach(x=>{

  const punto=
  datos.config.puntos.find(p=>p.id===x.punto)?.nombre||"";

  Object.entries(x.valores||{}).forEach(([id,v])=>{

   const p=
   datos.config.parametros.find(a=>a.id===id);

   if(p){

    filas.push([
     "Muestreo",
     x.fecha,
     punto,
     p.nombre,
     v,
     p.unidad,
     x.observaciones||""
    ]);

   }

  });

 });


 datos.incidencias.forEach(x=>{

  filas.push([
   "Incidencia",
   x.fecha,
   "",
   x.titulo,
   x.descripcion,
   "",
   ""
  ]);

 });


 const csv=
 filas.map(f=>
 f.map(v=>
 `"${String(v??"").replace(/"/g,'""')}"`
 ).join(";")
 ).join("\n");


 const blob=
 new Blob(["\ufeff"+csv],
 {type:"text/csv;charset=utf-8"});

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);

 a.download="ETAP_Control.csv";

 a.click();

}
