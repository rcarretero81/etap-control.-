<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>ETAP Control</title>

<link rel="manifest" href="manifest.json">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f7;
    color: #222;
}

header {
    background: #1565c0;
    color: white;
    padding: 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 5px 0 0;
    font-size: 13px;
}

.pages {
    display: flex;
    width: 500%;
    transition: transform .3s ease;
}

.page {
    width: 20%;
    min-height: calc(100vh - 120px);
    padding: 15px;
    flex-shrink: 0;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.card h2 {
    margin-top: 0;
    color: #1565c0;
    font-size: 19px;
}

label {
    display: block;
    font-weight: bold;
    margin: 12px 0 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    font-size: 16px;
    background: white;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.btn-primary {
    background: #1565c0;
    color: white;
    width: 100%;
    margin-top: 15px;
}

.btn-danger {
    background: #d32f2f;
    color: white;
}

.btn-edit {
    background: #f9a825;
    color: white;
}

.navigation {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 20;
}

.navigation button {
    background: transparent;
    color: #1565c0;
    padding: 8px 10px;
}

.navigation span {
    display: block;
    font-size: 11px;
    margin-top: 3px;
}

.content {
    overflow: hidden;
    padding-bottom: 70px;
}

.resultado {
    background: #e8f5e9;
    border-left: 5px solid #2e7d32;
    padding: 12px;
    border-radius: 6px;
    margin-top: 12px;
}

.historial-item {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fafafa;
}

.acciones {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.acciones button {
    flex: 1;
    font-size: 14px;
    padding: 9px;
}
</style>
</head>

<body>

<header>
    <h1>ETAP Control</h1>
    <p>Control de abastecimiento y calidad del agua</p>
</header>

<div class="content">
<div class="pages" id="pages">

<!-- PÁGINA 1 -->
<section class="page">

<div class="card">
<h2>📊 Lectura del contador</h2>

<label for="fecha">Fecha</label>
<input type="date" id="fecha">

<label for="contador">Lectura actual (m³)</label>
<input type="number" id="contador" step="0.01" min="0"
placeholder="Introduce la lectura">

<div class="resultado">
Consumo diario:
<strong id="consumoDiario">—</strong> m³
</div>

<button class="btn-primary" onclick="guardarContador()">
💾 Guardar
</button>

</div>

<div class="card">
<h2>Última lectura</h2>
<div id="ultimaLectura">
No hay lecturas guardadas.
</div>
</div>

</section>

<!-- PÁGINA 2 -->
<section class="page">

<div class="card">
<h2>🧪 Puntos de muestreo</h2>

<label for="puntoMuestreo">Punto de muestreo</label>

<select id="puntoMuestreo">
<option value="">Seleccionar...</option>
<option>Entrada ETAP</option>
<option>Depósito Distribución 1</option>
<option>Depósito Distribución 2</option>
<option>Red de distribución</option>
<option>Grifo domiciliario</option>
</select>

<label for="cloro">Cloro libre (mg/L)</label>
<input type="number" id="cloro" step="0.01">

<label for="ph">pH</label>
<input type="number" id="ph" step="0.01">

<label for="organoleptico">Examen organoléptico</label>

<select id="organoleptico">
<option value="">Seleccionar...</option>
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label for="observaciones">Observaciones</label>
<textarea id="observaciones" rows="3"></textarea>

<button class="btn-primary" onclick="guardarMuestreo()">
💾 Guardar
</button>

</div>

</section>

<!-- PÁGINA 3 -->
<section class="page">

<div class="card">
<h2>🏞️ Presas y embalses</h2>

<label for="presa">Presa / Embalse</label>
<input type="text" id="presa" placeholder="Nombre">

<label for="nivelPresa">Nivel / Estado</label>
<input type="text" id="nivelPresa">

<label for="observacionPresa">Observaciones</label>
<textarea id="observacionPresa" rows="3"></textarea>

<button class="btn-primary" onclick="guardarPresa()">
💾 Guardar
</button>

</div>

</section>

<!-- PÁGINA 4 -->
<section class="page">

<div class="card">
<h2>💧 Captaciones</h2>

<label for="captacion">Captación</label>
<input type="text" id="captacion" placeholder="Nombre">

<label for="estadoCaptacion">Estado</label>

<select id="estadoCaptacion">
<option value="">Seleccionar...</option>
<option>Normal</option>
<option>Incidencia</option>
<option>Fuera de servicio</option>
</select>

<label for="caudal">Caudal (m³/h)</label>
<input type="number" id="caudal" step="0.01">

<label for="observacionCaptacion">Observaciones</label>
<textarea id="observacionCaptacion" rows="3"></textarea>

<button class="btn-primary" onclick="guardarCaptacion()">
💾 Guardar
</button>

</div>

</section>

<!-- PÁGINA 5 -->
<section class="page">

<div class="card">
<h2>⚙️ Ajustes</h2>

<label for="nombreETAP">Nombre de la ETAP</label>
<input type="text" id="nombreETAP">

<label for="municipio">Municipio</label>
<input type="text" id="municipio">

<label for="deposito1">Depósito 1</label>
<input type="text" id="deposito1">

<label for="deposito2">Depósito 2</label>
<input type="text" id="deposito2">

<button class="btn-primary" onclick="guardarAjustes()">
💾 Guardar ajustes
</button>

</div>

<div class="card">

<h2>📋 Historial</h2>

<div id="historial">
No hay registros.
</div>

</div>

</section>

</div>
</div>

<nav class="navigation">

<button onclick="irPagina(0)">
📊
<span>Contador</span>
</button>

<button onclick="irPagina(1)">
🧪
<span>Muestreo</span>
</button>

<button onclick="irPagina(2)">
🏞️
<span>Presas</span>
</button>

<button onclick="irPagina(3)">
💧
<span>Captaciones</span>
</button>

<button onclick="irPagina(4)">
⚙️
<span>Ajustes</span>
</button>

</nav>

<script>

let paginaActual = 0;

function irPagina(numero) {
    paginaActual = numero;
    const desplazamiento = numero * 20;
    document.getElementById("pages").style.transform =
        "translateX(-" + desplazamiento + "%)";
}

function hoy() {
    const ahora = new Date();
    const año = ahora.getFullYear();
    const mes = String(ahora.getMonth() + 1).padStart(2, "0");
    const dia = String(ahora.getDate()).padStart(2, "0");
    return año + "-" + mes + "-" + dia;
}

document.getElementById("fecha").value = hoy();

function obtenerLecturas() {
    return JSON.parse(localStorage.getItem("lecturasContador") || "[]");
}

function guardarLecturas(datos) {
    localStorage.setItem("lecturasContador", JSON.stringify(datos));
}

function guardarContador() {

    const fecha = document.getElementById("fecha").value;
    const contador = parseFloat(document.getElementById("contador").value);

    if (!fecha || isNaN(contador)) {
        alert("Introduce la fecha y la lectura del contador.");
        return;
    }

    const lecturas = obtenerLecturas();

    const anterior = lecturas
        .filter(x => x.fecha < fecha)
        .sort((a,b) => b.fecha.localeCompare(a.fecha))[0];

    let consumo = null;

    if (anterior) {
        consumo = contador - parseFloat(anterior.contador);

        if (consumo < 0) {
            alert("La lectura actual no puede ser inferior a la anterior.");
            return;
        }
    }

    const existente = lecturas.findIndex(x => x.fecha === fecha);

    const registro = {
        fecha: fecha,
        contador: contador,
        consumo: consumo
    };

    if (existente >= 0) {
        lecturas[existente] = registro;
    } else {
        lecturas.push(registro);
    }

    lecturas.sort((a,b) => a.fecha.localeCompare(b.fecha));

    guardarLecturas(lecturas);

    document.getElementById("consumoDiario").textContent =
        consumo === null ? "—" : consumo.toFixed(2);

    actualizarUltimaLectura();
    actualizarHistorial();

    alert("Lectura guardada correctamente.");
}

function actualizarUltimaLectura() {

    const lecturas = obtenerLecturas();

    if (lecturas.length === 0) {
        document.getElementById("ultimaLectura").innerHTML =
            "No hay lecturas guardadas.";
        return;
    }

    const ultima = lecturas[lecturas.length - 1];

    document.getElementById("ultimaLectura").innerHTML =
        "<strong>Fecha:</strong> " + ultima.fecha +
        "<br><strong>Lectura:</strong> " + ultima.contador + " m³" +
        "<br><strong>Consumo:</strong> " +
        (ultima.consumo === null ? "—" : ultima.consumo.toFixed(2) + " m³");
}

function actualizarHistorial() {

    const lecturas = obtenerLecturas();
    const contenedor = document.getElementById("historial");

    if (lecturas.length === 0) {
        contenedor.innerHTML = "No hay registros.";
        return;
    }

    let html = "";

    [...lecturas].reverse().forEach((registro, indice) => {

        html += `
        <div class="historial-item">
            <strong>Contador</strong><br>
            Fecha: ${registro.fecha}<br>
            Lectura: ${registro.contador} m³<br>
            Consumo: ${
                registro.consumo === null
                ? "—"
                : registro.consumo.toFixed(2) + " m³"
            }

            <div class="acciones">
                <button class="btn-edit"
                    onclick="editarLectura('${registro.fecha}')">
                    ✏️ Modificar
                </button>

                <button class="btn-danger"
                    onclick="borrarLectura('${registro.fecha}')">
                    🗑️ Borrar
                </button>
            </div>
        </div>
        `;
    });

    contenedor.innerHTML = html;
}

function editarLectura(fecha) {

    const lecturas = obtenerLecturas();
    const registro = lecturas.find(x => x.fecha === fecha);

    if (!registro) return;

    document.getElementById("fecha").value = registro.fecha;
    document.getElementById("contador").value = registro.contador;

    irPagina(0);

    const anterior = lecturas
        .filter(x => x.fecha < fecha)
        .sort((a,b) => b.fecha.localeCompare(a.fecha))[0];

    if (anterior) {
        const consumo =
            parseFloat(registro.contador) -
            parseFloat(anterior.contador);

        document.getElementById("consumoDiario").textContent =
            consumo.toFixed(2);
    } else {
        document.getElementById("consumoDiario").textContent = "—";
    }
}

function borrarLectura(fecha) {

    if (!confirm("¿Quieres borrar esta lectura?")) {
        return;
    }

    let lecturas = obtenerLecturas();

    lecturas = lecturas.filter(x => x.fecha !== fecha);

    guardarLecturas(lecturas);

    actualizarUltimaLectura();
    actualizarHistorial();

    alert("Lectura eliminada.");
}

function guardarMuestreo() {

    const registro = {
        fecha: hoy(),
        punto: document.getElementById("puntoMuestreo").value,
        cloro: document.getElementById("cloro").value,
        ph: document.getElementById("ph").value,
        organoleptico: document.getElementById("organoleptico").value,
        observaciones: document.getElementById("observaciones").value
    };

    const historial =
        JSON.parse(localStorage.getItem("historialMuestreo") || "[]");

    historial.push(registro);

    localStorage.setItem(
        "historialMuestreo",
        JSON.stringify(historial)
    );

    alert("Muestreo guardado correctamente.");
}

function guardarPresa() {

    const registro = {
        fecha: hoy(),
        presa: document.getElementById("presa").value,
        nivel: document.getElementById("nivelPresa").value,
        observaciones:
            document.getElementById("observacionPresa").value
    };

    const historial =
        JSON.parse(localStorage.getItem("historialPresas") || "[]");

    historial.push(registro);

    localStorage.setItem(
        "historialPresas",
        JSON.stringify(historial)
    );

    alert("Datos de presa/embalse guardados.");
}

function guardarCaptacion() {

    const registro = {
        fecha: hoy(),
        captacion: document.getElementById("captacion").value,
        estado: document.getElementById("estadoCaptacion").value,
        caudal: document.getElementById("caudal").value,
        observaciones:
            document.getElementById("observacionCaptacion").value
    };

    const historial =
        JSON.parse(localStorage.getItem("historialCaptaciones") || "[]");

    historial.push(registro);

    localStorage.setItem(
        "historialCaptaciones",
        JSON.stringify(historial)
    );

    alert("Datos de captación guardados.");
}

function guardarAjustes() {

    const ajustes = {
        nombreETAP: document.getElementById("nombreETAP").value,
        municipio: document.getElementById("municipio").value,
        deposito1: document.getElementById("deposito1").value,
        deposito2: document.getElementById("deposito2").value
    };

    localStorage.setItem(
        "ajustesETAP",
        JSON.stringify(ajustes)
    );

    alert("Ajustes guardados correctamente.");
}

function cargarAjustes() {

    const ajustes =
        JSON.parse(localStorage.getItem("ajustesETAP") || "null");

    if (!ajustes) return;

    document.getElementById("nombreETAP").value =
        ajustes.nombreETAP || "";

    document.getElementById("municipio").value =
        ajustes.municipio || "";

    document.getElementById("deposito1").value =
        ajustes.deposito1 || "";

    document.getElementById("deposito2").value =
        ajustes.deposito2 || "";
}

document.addEventListener("DOMContentLoaded", function() {

    actualizarUltimaLectura();
    actualizarHistorial();
    cargarAjustes();

    irPagina(0);

});

</script>

</body>
</html>
