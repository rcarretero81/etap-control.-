function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type,size:file.size,data:r.result});r.onerror=reject;r.readAsDataURL(file)})}

function pdfEscape(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function crearPDFParte(titulo,lineas){
  const W=595,H=842,margin=42,leading=18;
  const clean=(x)=>String(x??'').replace(/\r?\n/g,' ').replace(/[^\x20-\x7E\xA0-\xFF]/g,'');
  let content='BT\n/F1 16 Tf\n'+margin+' '+(H-55)+' Td\n('+pdfEscape(clean(titulo))+') Tj\n/F1 10 Tf\n';
  lineas.forEach((line,i)=>{content+=(i===0?'0 -20 Td':'0 -'+leading+' Td')+'\n('+pdfEscape(clean(line))+') Tj\n';});
  content+='ET';
  const objects=[];
  objects[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objects[2]='<< /Type /Pages /Kids [3 0 R] /Count 1 >>';
  objects[3]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>';
  objects[4]='<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream';
  objects[5]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  let pdf='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n',offsets=[0];
  for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=i+' 0 obj\n'+objects[i]+'\nendobj\n';}
  const xref=pdf.length;pdf+='xref\n0 '+objects.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objects.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size '+objects.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  let bytes=new Uint8Array(pdf.length);for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
  let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return 'data:application/pdf;base64,'+btoa(bin);
}

function historialArchivosPorFechaBloques(anio,mes,fechaSeleccionada){

  const registros=Array.isArray(db.registros)?db.registros:[];
  const ordenBloques=['LECTURA CONTADOR','PUNTOS DE MUESTREO','PRESAS Y EMBALSES','CAPTACIONES','PARTES DE TRABAJO'];
  function fechaClave(valor){const d=new Date(valor||Date.now());return Number.isNaN(d.getTime())?'fecha-desconocida':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function fechaDesdeClave(k){const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
  function etiquetaFecha(k){const d=fechaDesdeClave(k);return d.toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
  const grupos={};
  function meter(fecha,bloque,item){const k=fechaClave(fecha);if(!grupos[k])grupos[k]={bloques:{}};if(!grupos[k].bloques[bloque])grupos[k].bloques[bloque]=[];grupos[k].bloques[bloque].push(item)}
  registros.forEach((r,i)=>{let bloque='';if(r.tipo==='Contador')bloque='LECTURA CONTADOR';else if(r.tipo==='Muestreo')bloque='PUNTOS DE MUESTREO';else if(r.tipo==='Embalse'||/presa|embalse/i.test(String(r.tipo||'')))bloque='PRESAS Y EMBALSES';else if(r.tipo==='Captación'||/captaci[oó]n/i.test(String(r.tipo||'')))bloque='CAPTACIONES';if(bloque)meter(r.fecha,bloque,{tipo:'registro',dato:r,indice:i})});
  partes.forEach((p,i)=>meter(p.fecha||p.id,'PARTES DE TRABAJO',{tipo:'parte',dato:p,indice:i}));
  const fechas=Object.keys(grupos).filter(k=>k!=='fecha-desconocida').sort((a,b)=>b.localeCompare(a));
  const hoy=new Date();
  const seleccion=fechaSeleccionada||null;
  const selDate=seleccion?fechaDesdeClave(seleccion):hoy;
  const y=Number.isInteger(anio)?anio:selDate.getFullYear(),m=Number.isInteger(mes)?mes:selDate.getMonth();
  const primerDia=new Date(y,m,1),diasMes=new Date(y,m+1,0).getDate(),desfase=(primerDia.getDay()+6)%7;
  const conteo={};Object.keys(grupos).forEach(k=>{conteo[k]=Object.values(grupos[k].bloques).reduce((n,a)=>n+a.length,0)});
  let html='<div class="card"><div class="section-head"><div class="title">HISTORIAL</div><span class="badge">'+(registros.length+partes.length)+'</span></div><div class="muted">Selecciona un día del calendario para consultar las lecturas guardadas, ordenadas por fecha y por bloques.</div>';
  html+='<div class="param-card"><div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:8px"><button class="small secondary" onclick="historialArchivosPorFechaBloques('+new Date(y,m-1,1).getFullYear()+','+new Date(y,m-1,1).getMonth()+(seleccion?',\''+seleccion+'\'':'')+')">‹</button><div class="title" style="text-align:center">'+esc(new Date(y,m,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}))+'</div><button class="small secondary" onclick="historialArchivosPorFechaBloques('+new Date(y,m+1,1).getFullYear()+','+new Date(y,m+1,1).getMonth()+(seleccion?',\''+seleccion+'\'':'')+')">›</button></div>';
  html+='<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px">';
  ['L','M','X','J','V','S','D'].forEach(d=>html+='<div style="text-align:center;font-weight:700;padding:5px 0">'+d+'</div>');
  for(let i=0;i<desfase;i++)html+='<div></div>';
  for(let dia=1;dia<=diasMes;dia++){
    const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(dia).padStart(2,'0'),hay=conteo[k]||0,activo=!!seleccion&&k===seleccion;
    html+='<button class="small '+(activo?'':'secondary')+'" style="min-width:0;width:100%;min-height:42px;padding:4px 1px;'+(activo?'outline:2px solid var(--accent);':'')+'" onclick="historialArchivosPorFechaBloques('+y+','+m+',\''+k+'\')">'+dia+(hay?'<div style="font-size:10px;font-weight:700">• '+hay+'</div>':'')+'</button>';

function abrirLecturaHistorial(i){

  const fecha=new Date(r.fecha||Date.now()).toLocaleString('es-ES');
  const titulo=r.tipo==='Contador'?'LECTURA DEL CONTADOR':r.tipo==='Muestreo'?'LECTURA DE PUNTO DE MUESTREO':r.tipo==='Embalse'?'LECTURA DE PRESA':r.tipo==='Captación'?'LECTURA DE CAPTACIÓN':'LECTURA GUARDADA';
  app.innerHTML='<div class="card"><div class="title">'+esc(titulo)+'</div><div class="muted">'+esc(fecha)+'</div><div class="param-card"><div class="param-name">'+esc(r.punto||r.tipo||'Registro')+'</div><div class="subsection"><b>'+esc(r.parametro||'Lectura')+'</b><h2>'+esc(r.valor===undefined?'—':r.valor)+' '+esc(r.unidad||'')+'</h2></div>'+(r.consumoDiario!==undefined&&r.consumoDiario!==null?'<p>Consumo diario: <b>'+esc(r.consumoDiario)+' m³</b></p>':'')+'<p>'+esc(r.observaciones||'Sin observaciones')+'</p></div><button class="wide" onclick="historialArchivosPorFechaBloques()">← Volver al historial</button></div>';
}
function mostrarPartesGuardados(){
  const partes=Array.isArray(db.partesGuardados)?db.partesGuardados:[];
  let html='<div class="card"><div class="title">PARTES GUARDADOS</div><div class="muted">Partes automáticos generados desde esta aplicación.</div>';
  if(!partes.length)html+='<p class="muted">Todavía no hay partes guardados.</p>';
  else partes.forEach((p,i)=>{const nombres=(p.seleccionados||[]).join(', ')||'Sin parámetros';html+='<div class="historyrow"><b>'+esc(new Date(p.fecha).toLocaleString('es-ES'))+'</b><br>'+esc(p.nombre)+'<br><span class="muted">'+esc(nombres)+'</span><button class="wide secondary" onclick="descargarParteGuardado('+i+')">⬇️ Descargar PDF</button></div>';});
  html+='<button class="wide" onclick="home(6)">Atrás</button></div>';app.innerHTML=html;
}
function descargarParteGuardado(i){const p=(db.partesGuardados||[])[i];if(!p?.data)return;const win=window.open('about:blank','_blank');fetch(p.data).then(r=>r.blob()).then(blob=>{const pdfUrl=URL.createObjectURL(blob);if(win)win.location.href=pdfUrl;else alert('No se ha podido abrir el PDF. Permite ventanas emergentes para ETAP CONTROL.');setTimeout(()=>URL.revokeObjectURL(pdfUrl),60000)}).catch(()=>{if(win)win.close();alert('No se ha podido abrir el PDF.')})}
</script>
</body></html>
